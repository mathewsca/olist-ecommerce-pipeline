# FabricaIA Configuration File

# Data paths
DATA_PATHS:
  raw: "data/raw"
  processed: "data/processed"
  external: "data/external"

# Model paths
MODEL_PATHS:
  trained: "models/trained"
  artifacts: "models/artifacts"

# Pipeline settings
PIPELINE:
  test_size: 0.2
  random_state: 42
  cv_folds: 5

# Feature engineering
FEATURES:
  polynomial_degree: 2
  rolling_windows: [3, 7, 14]
  lag_periods: [1, 2, 3, 7]

# Model settings
MODELS:
  algorithms:
    - "random_forest"
    - "logistic_regression"
    - "svm"

  hyperparameters:
    random_forest:
      n_estimators: [100, 200, 300]
      max_depth: [10, 20, None]
      min_samples_split: [2, 5, 10]

    logistic_regression:
      C: [0.1, 1, 10]
      penalty: ["l1", "l2"]

    svm:
      C: [0.1, 1, 10]
      kernel: ["linear", "rbf"]

# Visualization settings
VISUALIZATION:
  figsize: [10, 6]
  dpi: 100
  style: "seaborn-v0_8"

# Logging
LOGGING:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/fabricaia.log"

# MLflow settings (Local SQLite or Remote HTTP Server)
MLFLOW:
  tracking_uri: "sqlite:///mlflow.db"  # Ex. remoto: "http://seu-servidor-mlflow:5000"
  experiment_name: "fabricaia_experiments"
  registry_uri: "models/mlflow"
  enable_tracking: true
  username: null  # Ou via env MLFLOW_TRACKING_USERNAME
  password: null  # Ou via env MLFLOW_TRACKING_PASSWORD
